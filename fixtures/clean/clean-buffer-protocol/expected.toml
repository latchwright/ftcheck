justification = "Raw-pointer derefs of the `view` parameter in __getbuffer__/__releasebuffer__. CPython passes a Py_buffer owned by the requester, one per request, so writing through it is not writing to shared state; the class is frozen and immutable. FT001 must not fire. Reconstructed from a lint false positive on a public project, following PyO3's own buffer-protocol test."

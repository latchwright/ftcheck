[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "ftcheck"
version = "0.1.0"
description = "Free-threaded correctness harness for Rust/PyO3 extensions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/latchwright/ftcheck"
Issues = "https://github.com/latchwright/ftcheck/issues"

[project.scripts]
ftcheck = "ftcheck.cli:main"

[tool.maturin]
manifest-path = "crates/ftcheck-py/Cargo.toml"
python-source = "python"
module-name = "ftcheck._ftcheck"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

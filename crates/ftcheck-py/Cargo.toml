[package]
name = "ftcheck-py"
description = "Python bindings for ftcheck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_ftcheck"
crate-type = ["cdylib", "rlib"]

[dependencies]
ftcheck-core = { path = "../ftcheck-core" }
ftcheck-lint = { path = "../ftcheck-lint" }
# One wheel per platform covers CPython 3.11 and later. abi3 does not exist for
# free-threaded 3.14, so a 3.14t build gets a version-specific cp314t wheel.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
semver = { workspace = true }
serde_json = { workspace = true }
